name: Java + Python CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Java app
        run: mvn clean package

      - name: Run Java app
        run: java -cp target/sample-app-1.0-SNAPSHOT.jar com.example.App

      
